name: Apply ChatGPTView routing patch

on:
  push:
    branches:
      - feature/chatgptview-routing

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply targeted ChatGPTView changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def load(path):
              p = Path(path)
              data = p.read_bytes()
              bom = data.startswith(b"\xef\xbb\xbf")
              text = data.decode("utf-8-sig").replace("\r\n", "\n")
              return p, text, bom

          def save(p, text, bom):
              text = text.replace("\r\n", "\n")
              if b"\r\n" in p.read_bytes():
                  text = text.replace("\n", "\r\n")
              data = text.encode("utf-8")
              if bom:
                  data = b"\xef\xbb\xbf" + data
              p.write_bytes(data)

          def replace_once(path, old, new):
              p, text, bom = load(path)
              if old not in text:
                  raise RuntimeError(f"Expected text not found in {path}")
              text = text.replace(old, new, 1)
              save(p, text, bom)

          # ------------------------------------------------------------
          # MainWindow.xaml.cs
          # ------------------------------------------------------------
          path = "AiInterviewAssistant/MainWindow.xaml.cs"
          p, text, bom = load(path)

          old = '''        private async void ChatGPTWebViewHost_ChatGPTReady(\n            object sender,\n            EventArgs e)\n        {\n            await ChatGPTWebViewHost.InjectQuestionAsync(\n                "Hello, this is a test question");\n        }'''

          new = '''        private async void ChatGPTWebViewHost_ChatGPTReady(\n            object sender,\n            EventArgs e)\n        {\n            await Task.CompletedTask;\n        }'''

          if old not in text:
              raise RuntimeError("Temporary ChatGPT injection handler not found")
          text = text.replace(old, new, 1)

          pattern = re.compile(
              r'''                    // =================================================\n                    // SPACE\n                    // =================================================\n\n                    \(\) =>\n                    \{.*?\n                    \},\n\n\n                    // =================================================\n                    // ALT \+ ENTER''',
              re.S)

          replacement = '''                    // =================================================\n                    // SPACE\n                    // =================================================\n\n                    () =>\n                    {\n                        try\n                        {\n                            if (_chatGPTView)\n                            {\n                                _ = ChatGPTWebViewHost.ToggleVoiceAsync();\n                                return;\n                            }\n\n                            if (!IsVoiceInputEnabled())\n                                return;\n\n                            if (voiceRecorder == null)\n                            {\n                                StartVoiceRecording();\n                            }\n                            else\n                            {\n                                StopVoiceRecording();\n                            }\n                        }\n                        catch\n                        {\n                        }\n                    },\n\n\n                    // =================================================\n                    // ALT + ENTER'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError("SPACE hotkey block not found")

          save(p, text, bom)

          # ------------------------------------------------------------
          # MainWindow.UI.cs
          # ------------------------------------------------------------
          path = "AiInterviewAssistant/MainWindow/MainWindow.UI.cs"
          p, text, bom = load(path)

          old = '''        private void NewChatButton_Click(\n            object sender,\n            RoutedEventArgs e)\n        {\n            if (isGenerating &&\n                cancellationTokenSource != null)\n            {\n                cancellationTokenSource.Cancel();\n            }\n\n\n            ClearConversation();\n        }'''
          new = '''        private void NewChatButton_Click(\n            object sender,\n            RoutedEventArgs e)\n        {\n            if (_chatGPTView)\n                return;\n\n            if (isGenerating &&\n                cancellationTokenSource != null)\n            {\n                cancellationTokenSource.Cancel();\n            }\n\n\n            ClearConversation();\n        }'''
          if old not in text:
              raise RuntimeError("NewChatButton_Click block not found")
          text = text.replace(old, new, 1)

          old = '''        private void MessageModeButton_Click(\n            object sender,\n            RoutedEventArgs e)\n        {\n            try\n            {'''
          new = '''        private void MessageModeButton_Click(\n            object sender,\n            RoutedEventArgs e)\n        {\n            try\n            {\n                if (_chatGPTView)\n                    return;'''
          if old not in text:
              raise RuntimeError("MessageModeButton_Click start not found")
          text = text.replace(old, new, 1)

          old = '''        private void VoiceButton_Click(\n            object sender,\n            RoutedEventArgs e)\n        {\n            try\n            {\n               \n                // =====================================================\n                // EXISTING VOICE FUNCTIONALITY'''
          new = '''        private void VoiceButton_Click(\n            object sender,\n            RoutedEventArgs e)\n        {\n            try\n            {\n                if (_chatGPTView)\n                {\n                    if (TextInputPanel != null)\n                        TextInputPanel.Visibility = Visibility.Collapsed;\n\n                    _ = ChatGPTWebViewHost.ToggleVoiceAsync();\n                    return;\n                }\n\n                // =====================================================\n                // EXISTING VOICE FUNCTIONALITY'''
          if old not in text:
              raise RuntimeError("VoiceButton_Click start not found")
          text = text.replace(old, new, 1)

          save(p, text, bom)

          # ------------------------------------------------------------
          # MainWindow.Voice.Core.cs
          # ------------------------------------------------------------
          path = "AiInterviewAssistant/MainWindow/Voice/MainWindow.Voice.Core.cs"
          p, text, bom = load(path)

          old = '''        private bool IsVoiceInputEnabled()\n        {\n            try\n            {\n                AppSettings settings ='''
          new = '''        private bool IsVoiceInputEnabled()\n        {\n            try\n            {\n                if (_chatGPTView)\n                {\n                    _ = ChatGPTWebViewHost.ToggleVoiceAsync();\n                    return false;\n                }\n\n                AppSettings settings ='''
          if old not in text:
              raise RuntimeError("IsVoiceInputEnabled block not found")
          text = text.replace(old, new, 1)
          save(p, text, bom)

          # ------------------------------------------------------------
          # MainWindow.AI.Request.cs
          # ------------------------------------------------------------
          path = "AiInterviewAssistant/MainWindow/AI/MainWindow.AI.Request.cs"
          p, text, bom = load(path)

          old = '''                    await ChatGPTWebViewHost.SendQuestionAsync(\n                        question);\n\n                    Debug.WriteLine(\n                        "SEND QUESTION: ChatGPT WebView send completed.");\n\n                    return;'''
          new = '''                    await ChatGPTWebViewHost.SendQuestionAsync(\n                        question);\n\n                    isGenerating = false;\n\n                    Debug.WriteLine(\n                        "SEND QUESTION: ChatGPT WebView send completed.");\n\n                    return;'''
          if old not in text:
              raise RuntimeError("ChatGPTView SendQuestion routing block not found")
          text = text.replace(old, new, 1)

          old = '''        private void ClearConversation()\n        {\n            if (aiTypingTimer != null)'''
          new = '''        private void ClearConversation()\n        {\n            if (_chatGPTView)\n            {\n                isGenerating = false;\n                return;\n            }\n\n            if (aiTypingTimer != null)'''
          if old not in text:
              raise RuntimeError("ClearConversation start not found")
          text = text.replace(old, new, 1)
          save(p, text, bom)

          print("ChatGPTView patch applied successfully")

      - name: Build patched project
        shell: pwsh
        run: |
          & msbuild "AiInterviewAssistant\AiInterviewAssistant.csproj" /t:Build /p:Configuration=Release /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit patched files and remove temporary workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AiInterviewAssistant/MainWindow/MainWindow.UI.cs AiInterviewAssistant/MainWindow/MainWindow.xaml.cs AiInterviewAssistant/MainWindow/Voice/MainWindow.Voice.Core.cs AiInterviewAssistant/MainWindow/AI/MainWindow.AI.Request.cs
          git rm .github/workflows/_chatgptview_patch.yml
          git commit -m "Route ChatGPTView voice and question flow"
          git push origin HEAD:feature/chatgptview-routing
